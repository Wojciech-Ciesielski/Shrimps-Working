name: AppDB probe (tymczasowy)

on:
  push:
    paths: [".github/workflows/appdb-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Wyszukiwanie POST
        run: |
          set +e
          for n in "Notepad++" "7-Zip" "IrfanView"; do
            curl -sSL -A shrimp-apps-ci -o s.html -w "search $n %{http_code}\n" \
              'https://appdb.winehq.org/objectManager.php?bIsQueue=false&bIsRejected=false&sClass=application&sTitle=Browse+Applications&iItemsPerPage=25&iPage=1&sOrderBy=appName&bAscending=true' \
              --data-urlencode "iappFamily-appNameOp=2" --data-urlencode "sappFamily-appNameData=$n" \
              --data-urlencode "iappVersion-ratingOp=5" --data-urlencode "iappCategoryOp=11" --data-urlencode "iappVersion-licenseOp=5" \
              --data-urlencode "ionlyDownloadableOp=10" --data-urlencode "sFilterSubmit="
            grep -o 'Showing entry.*</p>' s.html
            grep -o '<tr><td><a href="https://appdb.winehq.org/objectManager.php?sClass=application&amp;iId=[0-9]*">[^<]*</a>' s.html | head -5
            id=$(grep -o 'sClass=application&amp;iId=[0-9]*">' s.html | head -1 | grep -o '[0-9]*')
            curl -sSL -A shrimp-apps-ci -o a.html "https://appdb.winehq.org/objectManager.php?sClass=application&iId=$id"
            grep -o '<td class="[A-Za-z]*" align="center">[A-Za-z]*</td><td align="center">[^<]*</td>' a.html | head -8
            grep -o '<tr  data-donav[^>]*><td><a [^>]*>[^<]*</a>' a.html | head -8
          done
