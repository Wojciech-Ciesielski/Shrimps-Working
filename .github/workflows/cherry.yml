name: Cherry

on:
  push:
    paths: ["boxes/cherry/**", "boxes/shrimp-i18n/**", "boxes/i18n-core/**", "boxes/help-links/**", ".github/workflows/cherry.yml"]
  pull_request:
    paths: ["boxes/cherry/**", "boxes/shrimp-i18n/**", "boxes/i18n-core/**", "boxes/help-links/**", ".github/workflows/cherry.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Testy po polsku (LANGUAGE czyta i18n Shrimp)
    env: { LANGUAGE: pl }
    defaults: { run: { working-directory: boxes/cherry } }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev desktop-file-utils
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: desktop-file-validate data/org.shrimp.Cherry.desktop
      - name: Wtyczki zsh z Cherry (vendor/) ładują się w zsh
        run: |
          sudo apt-get install -y --no-install-recommends zsh
          SHRIMP_PREBUILT=1 ./install.sh "$RUNNER_TEMP/root"
          P="$RUNNER_TEMP/root/usr/share/cherry/zsh-plugins"
          zsh -f -c "source $P/zsh-autosuggestions/zsh-autosuggestions.zsh && source $P/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh && print -r -- \"\$ZSH_AUTOSUGGEST_STRATEGY \$ZSH_HIGHLIGHT_VERSION\"" | tee /dev/stderr | grep -q '0.8.0'
