name: Filer

on:
  push:
    paths: ["boxes/filer/**", "boxes/shrimp-i18n/**", "boxes/i18n-core/**", ".github/workflows/filer.yml"]
  pull_request:
    paths: ["boxes/filer/**", "boxes/shrimp-i18n/**", "boxes/i18n-core/**", ".github/workflows/filer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Testy po polsku (LANGUAGE czyta i18n Shrimp)
    env: { LANGUAGE: pl }
    defaults: { run: { working-directory: boxes/filer } }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev desktop-file-utils
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: desktop-file-validate data/org.shrimp.Filer.desktop
