[package]
name = "cherry"
version = "0.1.0"
edition = "2021"
description = "Cherry: terminal Shrimp, który tłumaczy komendy (GTK4 + libadwaita + VTE, zsh)"
license = "GPL-3.0-or-later"

[build-dependencies]
# teksty z i18n/ wbudowuje build.rs (shrimp_i18n::codegen)
shrimp-i18n = { path = "../shrimp-i18n" }

[dependencies]
shrimp-i18n = { path = "../shrimp-i18n" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
vte = { package = "vte4", version = "0.10", features = ["v0_76"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
