[box]
id = "filer"
version = "0.1.0"
kind = "app"
summary = "Menedżer plików: funkcje i układ 1:1 z Nemo (GTK4 + libadwaita + ikony MoreWaita, Rust)"
build_depends = ["shrimp-i18n", "help-links"]
ci = "filer"

[packages]
image = ["libgtk-4-1", "libadwaita-1-0", "gvfs", "gvfs-backends"]
build = [
    "bash",
    "coreutils",
    "findutils",
    "gawk",
    "gcc",
    "pkg-config",
    "rustup",
    "ca-certificates",
    "ca-certificates-mozilla",
    "pkgconfig(gtk4)",
    "pkgconfig(libadwaita-1)",
]

[build]
chroot = "cargo build --release --locked"
outputs = ["target/release/filer"]
install = "install.sh"
